name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-shell:
    name: Shell App — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: shell-app/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run test

  test-remote:
    name: Remote App — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: remote-app/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run test

  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: [test-shell, test-remote]

    steps:
      - uses: actions/checkout@v4

      - name: Build shell image
        run: docker build -f shell-app/Dockerfile -t shell-app:ci .

      - name: Build remote image
        run: docker build -f remote-app/Dockerfile -t remote-app:ci .
